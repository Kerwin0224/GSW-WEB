# main 分支的迁移文件变更会自动推送到 Supabase 云端。
# 密钥：repo Settings → Secrets → Actions 里的 SUPABASE_ACCESS_TOKEN 和 SUPABASE_DB_PASSWORD。
# 为什么只监听 migrations 目录：schema 变更与代码部署解耦，其他文件改动不触发迁移。
name: supabase-db-push

on:
  push:
    branches: [main]
    paths:
      - 'web/supabase/migrations/**'

jobs:
  push-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations to cloud project
        working-directory: web
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked
