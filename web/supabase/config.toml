# 本仓只把 Supabase 当云端开发用，**永不起本地栈**（见 docs/agents/deployment.md）。
# `supabase init` 生成的 26 个配置段（[api] / [studio] / [inbucket] / [storage] /
# [realtime] / [analytics] / [edge_runtime] / [local_smtp] / [auth] 全部子段 /
# [experimental] …）只服务本地容器，且它们的值本来就与 CLI 内置默认值逐字相同。
# 远端工作流只走 --linked 系列（db push / db query / migration list / db advisors / db lint），
# 不读这些段；删掉后行为不变，已用 `db push --dry-run --linked` 实测对照过。
# 留在这里的只有远端命令真正会读到的东西。
project_id = "web"

[db]
# 必须与云端一致（`SHOW server_version;`），否则 db push 会告警。
major_version = 17

[db.migrations]
# 置 false 会让 db push 静默跳过全部迁移。
enabled = true
